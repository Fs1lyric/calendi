[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/booker"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Nabhan Lyric Chowdhury <fs.lyric@proton.me>"]
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rrule = "0.14"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
