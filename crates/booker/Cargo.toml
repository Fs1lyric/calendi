[package]
name = "lyric-cal-booker"
description = "Lyric Cal's booking daemon: the public booking page and its JSON API"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
lyric-cal-core = { path = "../core" }
axum = "0.8"
chrono.workspace = true
chrono-tz.workspace = true
iana-time-zone = "0.1"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "time", "process"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
